[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kar-scraper"
version = "0.1.0"
description = "CLI AI agent that finds and downloads public .kar karaoke files."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Kar Scraper" }]
dependencies = [
    "firecrawl-py>=4.28.0",
    "httpx>=0.27.0",
    "langgraph>=1.0.0",
    "openai>=1.99.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.1",
    "rich>=13.7.1",
    "tenacity>=8.3.0",
    "typer>=0.12.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "respx>=0.21.1",
]

[project.scripts]
kar-scraper = "kar_scraper.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/kar_scraper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
